<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#EDF2EF;font-family:'Noto Sans Thai','Noto Sans',system-ui,sans-serif}a{color:#26A369}a:hover{color:#176340}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;box-sizing:border-box">
<div style="width:390px;height:844px;border-radius:44px;background:#0E2B1E;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(16,40,34,.28)">

<div style="position:absolute;inset:0;background:linear-gradient(180deg,#1a3a2a 0%,#12261c 100%)">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 12px,transparent 12px 24px)"></div>
<div style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:190px;height:250px;border:1.5px dashed rgba(207,241,225,.4);border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box">
<span style="font-size:10px;letter-spacing:.08em;color:rgba(207,241,225,.6)">CAMERA · ภาพจากกล้อง</span>
</div>
<div style="position:absolute;left:50%;top:44%;transform:translateX(-50%);width:2px;height:120px;background:#30CF85;box-shadow:0 0 12px rgba(48,207,133,.8)"></div>
<div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:7px;background:#30CF85"></div>
<div style="position:absolute;left:50%;top:38%;transform:translateX(-50%) rotate(-14deg);width:76px;height:2px;background:#E5484D;box-shadow:0 0 10px rgba(229,72,77,.7)"></div>
<div style="position:absolute;left:63%;top:36%;padding:3px 8px;border-radius:999px;background:rgba(229,72,77,.92);color:#fff;font-size:11px;font-weight:700">42°</div>
</div>

<div style="position:absolute;top:52px;left:16px;right:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#30CF85,#1D7C50)"></div>
<div style="flex:1;display:flex;flex-direction:column">
<span style="color:#fff;font-size:15px;font-weight:800;line-height:1.15">SmartFlex</span>
<span style="color:rgba(207,241,225,.75);font-size:10.5px">กำลังตรวจ · Live</span>
</div>
<div style="display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)">
<div style="width:7px;height:7px;border-radius:4px;background:#30CF85"></div>
<span style="color:#fff;font-size:11px;font-weight:600">18:24</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:18px;background:rgba(229,72,77,.94);box-shadow:0 8px 22px rgba(16,40,34,.35)">
<div style="flex:1;display:flex;flex-direction:column;gap:2px">
<span style="color:#fff;font-size:16px;font-weight:800">ยกหน้าจอขึ้น</span>
<span style="color:rgba(255,255,255,.85);font-size:12px">Raise your screen · คอยื่นไปข้างหน้า 42°</span>
</div>
<span style="color:#fff;font-size:30px;font-weight:800;line-height:1">54</span>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;bottom:104px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px;padding:13px 15px;border-radius:18px;background:rgba(10,26,19,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="color:rgba(207,241,225,.8);font-size:10.5px;letter-spacing:.06em">เซสชันนี้ · THIS SESSION</span>
<span style="color:#fff;font-size:11px;font-weight:700">ดี 71%</span>
</div>
<div style="display:flex;gap:2px;height:26px;align-items:flex-end">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="24">
<div style="flex:1;height:{{ b.h }};border-radius:2px;background:{{ b.c }}"></div>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between"><span style="color:rgba(207,241,225,.55);font-size:10px">18:06</span><span style="color:rgba(207,241,225,.55);font-size:10px">ตอนนี้</span></div>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;gap:8px;padding:7px;border-radius:999px;background:rgba(10,26,19,.78);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<button type="button" style="flex:1;height:42px;border:none;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer">{{ t.name }}</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const seq = [3,2,2,1,2,3,3,2,1,1,2,3,3,3,2,1,0,1,2,3,3,2,1,0];
    return {
      bars: seq.map(v => ({ h: (8 + v * 6) + 'px', c: v >= 3 ? '#30CF85' : v === 2 ? '#1FA971' : v === 1 ? '#C8A02E' : '#E5484D' })),
      tabs: [['ตรวจ', 1], ['ผล', 0], ['ท่านั่ง', 0], ['ตั้งค่า', 0]].map(([name, on]) => ({
        name, bg: on ? '#fff' : 'transparent', fg: on ? '#176340' : 'rgba(255,255,255,.72)',
      })),
    };
  }
}
</script>
</body>
</html>
